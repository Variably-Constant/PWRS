# Build and deploy the PWRS wiki (Hugo + Hextra) to GitHub Pages.
#
# Adapted from the canonical hextra-starter-template pages.yaml
# (github.com/imfing/hextra-starter-template/.github/workflows/pages.yaml).
# The Hugo site lives at wiki/ in this repo rather than at the root, so
# the setup-go cache, build and upload-artifact steps all scope to it.
#
# Every push to main rebuilds the site, with no paths filter. A release
# here force-pushes a single parentless commit over the last one, and
# GitHub derives a push's changed paths from its before and after
# commits, so a commit sharing no ancestor with what it replaced
# matches no filter at all. A filtered trigger would skip exactly the
# pushes whose documentation the published crate READMEs link to. The
# build costs a few minutes of runner time per push.
name: Deploy PWRS Wiki

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a run queued behind the one in progress is
# replaced by a newer one, and the run in progress always completes.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache-dependency-path: wiki/go.sum
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The package is checked against the SHA-256 the release's own
      # checksums file lists before it is installed.
      - name: Setup Hugo
        working-directory: ${{ runner.temp }}
        run: |
          deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          wget -q -O "$deb" "$base/$deb"
          wget -q -O checksums.txt "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " $deb\$" checksums.txt | sha256sum --check --strict
          sudo dpkg -i "$deb"
          hugo version
      - name: Build with Hugo
        working-directory: ./wiki
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./wiki/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
