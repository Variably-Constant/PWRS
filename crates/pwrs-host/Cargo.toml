[package]
name = "pwrs-host"
description = "Hosts the PowerShell engine in-process from Rust via hostfxr, for tests and benches"
# The workspace's test host. Its surface was shaped by this repo's own
# suites and has no consumer outside them, so it stays out of the
# published set until it is meant as a product.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
libloading = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
pwrs-build = { path = "../pwrs-build", version = "=0.2.3" }
