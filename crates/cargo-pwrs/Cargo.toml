[package]
name = "cargo-pwrs"
description = "Build tool: turns a pwrs crate into an importable PowerShell module folder"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["powershell", "cmdlet", "cargo-subcommand", "build-tool"]
categories = ["development-tools::build-utils", "command-line-utilities"]
# These tests read the repository's README, changelog and LICENSE, which
# a packaged crate does not carry.
exclude = ["tests/version_references.rs", "tests/license_copies.rs"]

[[bin]]
name = "cargo-pwrs"
path = "src/main.rs"

[dependencies]
pwrs-build = { path = "../pwrs-build", version = "=0.2.3" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
libloading = "0.9.0"
