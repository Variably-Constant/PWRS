[package]
name = "cargo-pwrs"
description = "Build tool: turns a pwrs crate into an importable PowerShell module folder"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["powershell", "cmdlet", "cargo-subcommand", "build-tool"]
categories = ["development-tools::build-utils", "command-line-utilities"]
# These tests read the repository's README, changelog and LICENSE, which
# a packaged crate does not include.
exclude = ["tests/version_references.rs", "tests/license_copies.rs"]

[[bin]]
name = "cargo-pwrs"
path = "src/main.rs"

[dependencies]
pwrs-build = { path = "../pwrs-build", version = "=0.8.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }
libloading = "0.9.0"
sha2 = "0.11.1"
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2"] }
flate2 = "1.1.10"
tar = { version = "0.4.46", default-features = false }
