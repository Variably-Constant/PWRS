name: ci

# Builds each pwrs module and runs its Pester suite on macOS arm64, the
# one platform no machine of the project's own runs. Windows, Linux and
# FreeBSD are gated on those machines. The native cdylib must be linked
# by the target's own linker, which is why each job builds on the OS it
# tests. macos-signing signs hello on macOS after merging in the build
# windows-hello makes, so each folder it signs can be imported on
# Windows, and uploads the signed folders for tools/signing_gate.ps1
# -Verify on a Windows machine. It runs on a ci/ branch pushed for the
# run and deleted once the run is read, never on main.

on:
  push:
    branches: ['ci/**']
  pull_request:

jobs:
  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A commit on the action's master branch: its README requires a
      # pinned commit to be in master's history. A commit names no
      # toolchain, so the `toolchain` input names it.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      # cargo pwrs test fetches the Pester it runs the suites under into
      # the toolchain, so the job installs none.
      - name: The pwsh this job runs on
        shell: pwsh
        run: |
          "pwsh $($PSVersionTable.PSVersion) on $([System.Runtime.InteropServices.RuntimeInformation]::FrameworkDescription), $([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
      - name: Rust unit tests
        run: cargo test --profile test-fast --workspace
      - name: Build and test each example (pwsh 7)
        shell: pwsh
        run: |
          foreach ($m in 'hello', 'calc', 'memfs', 'tls', 'file-facts') {
            cargo run --profile test-fast -p cargo-pwrs -- pwrs test --release --manifest-dir "examples/$m"
            if ($LASTEXITCODE -ne 0) { throw "module $m failed" }
          }
      # What the hello build ships for macOS, its helper's app bundle among
      # it, as How To Ship A Helper Executable lists it.
      - name: The hello module's runtime files
        shell: pwsh
        run: |
          $root = (Resolve-Path target/pwrs/Hello).Path
          Get-ChildItem -Recurse -File (Join-Path $root 'runtimes') | ForEach-Object { '{0,-72} {1,10} bytes' -f $_.FullName.Substring($root.Length + 1), $_.Length }
          Get-ChildItem -Recurse -File -Filter Info.plist (Join-Path $root 'runtimes') | ForEach-Object { "== $($_.FullName.Substring($root.Length + 1))"; Get-Content -Raw -LiteralPath $_.FullName }
      # The packaging cargo pwrs publish --dry-run does, its publish.ps1
      # over the hello build, then the package saved from a folder
      # repository as Install-PSResource saves one. A .nupkg records no
      # Unix mode, so the saved helper starts only because staging makes
      # it executable.
      - name: The hello package, saved and its helper started (pwsh 7)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'hello-package'
          & ./crates/cargo-pwrs/scripts/publish.ps1 -ModulePath target/pwrs/Hello -OutDir $out -DryRun
          if ($LASTEXITCODE -ne 0) { throw 'publish.ps1 did not package the hello build' }
          $nupkg = Get-ChildItem -LiteralPath $out -Filter *.nupkg | Select-Object -First 1
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($nupkg.FullName)
          try { $entries = @($zip.Entries | ForEach-Object { [Uri]::UnescapeDataString($_.FullName) }) } finally { $zip.Dispose() }
          $entries | Where-Object { $_ -like 'runtimes/*' } | Sort-Object | ForEach-Object { "PACKAGE $_" }
          if ($entries -notcontains 'runtimes/osx-arm64/native/Hello Helper.app/Contents/MacOS/hello-helper') { throw "$($nupkg.Name) has no Hello Helper.app" }
          Register-PSResourceRepository -Name hello-ci -Uri $out -Trusted
          $saved = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'hello-saved')
          Save-PSResource -Name Hello -Repository hello-ci -Path $saved.FullName -TrustRepository
          $helper = Get-ChildItem -Recurse -File -LiteralPath $saved.FullName -Filter hello-helper | Select-Object -First 1
          "SAVED $($helper.FullName.Substring($saved.FullName.Length + 1)) $([IO.File]::GetUnixFileMode($helper.FullName))"
          $manifest = Get-ChildItem -Recurse -File -LiteralPath $saved.FullName -Filter Hello.psd1 | Select-Object -First 1
          pwsh -NoProfile -NonInteractive -Command "Import-Module '$($manifest.FullName)'; Invoke-HelloHelper where; Invoke-HelloHelper bundle"
          if ($LASTEXITCODE -ne 0) { throw 'the saved module did not start its helper' }
      # Every tutorial chapter's files built, and tested from the chapter
      # that adds a suite, and every example on its page run as printed.
      - name: The tutorial, chapter by chapter (pwsh 7)
        shell: pwsh
        run: ./tools/tutorial_gate.ps1
      - name: A rebuilt module takes over a live session (pwsh 7)
        shell: pwsh
        run: ./tools/hot_reload_gate.ps1
      - name: Two modules in one session make their own objects (pwsh 7)
        shell: pwsh
        run: ./tools/coload_gate.ps1
      # hello built with symbols, so its symbol tests read .pdb files the
      # loader stages beside its copies; last, so the steps above read the
      # build without them.
      - name: The hello example with symbols (pwsh 7)
        shell: pwsh
        run: |
          cargo run --profile test-fast -p cargo-pwrs -- pwrs test --release --debug-symbols --manifest-dir examples/hello
          if ($LASTEXITCODE -ne 0) { throw 'hello with symbols failed' }
      # The macOS sessions How To Debug A Module quotes, on hello built
      # without --release: pwsh started under lldb, stopping at a line of
      # hello's lib.rs and where a panic starts, then lldb attached to a
      # running pwsh, as this user and with sudo. Every session prints in
      # full. The step fails at the end if the breakpoint on the line was
      # never hit, in the pwsh lldb started or in either attached session.
      # The pwsh lldb attaches to starts with PAL_MachExceptionMode=2.
      # Without it, .NET's runtime takes the breakpoint's trap on its own
      # threads, finds it is not one of its own, and runs the same
      # instruction again, so the thread spins and lldb never stops. The
      # runtime reads the variable when it starts, and leaves the trap to
      # the debugger by itself when one was attached then.
      - name: lldb on the hello example (pwsh 7)
        shell: bash
        run: |
          cargo run --profile test-fast -p cargo-pwrs -- pwrs build --manifest-dir examples/hello 2>&1 | tail -1
          module="$PWD/target/pwrs/Hello/Hello.psd1"
          pwsh_path="$(command -v pwsh)"
          lldb --version | head -1
          echo "=== lldb, a breakpoint on a line"
          lldb --batch \
            -o 'breakpoint set --file hello/src/lib.rs --line 37' \
            -o 'process launch' \
            -o 'thread backtrace -c 4' \
            -o 'frame variable self' \
            -o 'process kill' \
            -- "$pwsh_path" -NoProfile -NonInteractive -Command "Import-Module '$module'; Get-Greeting -Name debugger" 2>&1 | tee "$RUNNER_TEMP/lldb-line.log" || echo "lldb exit $?"
          echo "=== lldb, where a panic starts"
          lldb --batch \
            -o 'breakpoint set --name rust_panic' \
            -o 'process launch' \
            -o 'thread backtrace -c 8' \
            -o 'process kill' \
            -- "$pwsh_path" -NoProfile -NonInteractive -Command "Import-Module '$module'; Get-Greeting -Name debugger -Panic" 2>&1 || echo "lldb exit $?"
          echo "=== what PowerShell shows for the panic"
          pwsh -NoProfile -NonInteractive -Command "Import-Module '$module'; Get-Greeting -Name debugger -Panic" 2>&1 || echo "pwsh exit $?"
          echo "=== lldb attached to a running pwsh"
          diag="$RUNNER_TEMP/lldb-attach"
          mkdir -p "$diag"
          ready="$diag/ready"
          stop="$diag/stop"
          calls="$diag/calls"
          PAL_MachExceptionMode=2 pwsh -NoProfile -NonInteractive -Command "Import-Module '$module'; Set-Content -Path '$ready' -Value \$PID; \$n = 0; \$deadline = [DateTime]::UtcNow.AddMinutes(10); while (-not (Test-Path '$stop') -and [DateTime]::UtcNow -lt \$deadline) { \$null = Get-Greeting -Name attached; \$n++; Set-Content -Path '$calls' -Value \$n; Start-Sleep -Milliseconds 500 }" &
          for i in $(seq 120); do [ -s "$ready" ] && break; sleep 1; done
          pid=$(tr -d '\r\n' < "$ready")
          # The running pwsh's state and CPU time from ps, and how many
          # times its loop has called Get-Greeting.
          state() { echo "$1: state $(ps -o stat= -p "$pid"), cpu $(ps -o time= -p "$pid"), calls $(cat "$calls" 2>/dev/null)"; }
          # Each attached session ends after 120 seconds, through perl's
          # alarm since macOS has no timeout command, so the job ends even
          # if the breakpoint never fires. 20 seconds in, while lldb waits
          # in continue, the state prints again and sample records every
          # thread's stack. The step prints the stack of the thread that
          # runs the loop. lldb logs every message between it and
          # debugserver, the helper that stops and starts pwsh for it, and
          # the step prints the log's end. Everything goes into the
          # macos-lldb-attach artifact.
          attach() {
            who="$1"
            shift
            state "before attaching"
            (
              sleep 20
              state "20 seconds in"
              "$@" sample "$pid" 2 -file "$diag/sample-$who.txt" > /dev/null 2>&1 || echo "sample exit $?"
              awk '/Thread_[0-9]+.*Pipeline Execution Thread/ { p = 1; print; next } p && (/^ +[0-9]+ Thread_/ || /^$/) { p = 0 } p' "$diag/sample-$who.txt" | head -n 60 || true
            ) &
            sampler=$!
            "$@" perl -e 'alarm 120; exec @ARGV' lldb --batch -p "$pid" \
              -O "log enable -f $diag/packets-$who.log gdb-remote packets" \
              -o 'breakpoint set --file hello/src/lib.rs --line 37' -o 'breakpoint list' -o 'process status' -o 'thread list' \
              -o 'continue' -o 'thread backtrace -c 3' -o 'detach' 2>&1 | tee "$diag/lldb-$who.log" || echo "lldb exit $?"
            wait "$sampler" || true
            state "after lldb"
            echo "the last packets:"
            tail -n 30 "$diag/packets-$who.log" | cut -c 1-300 || true
          }
          echo "--- as $(id -un)"
          attach user
          echo "--- with sudo"
          attach root sudo
          # lldb run as root writes its log readable only by root.
          sudo chmod -R a+r "$diag"
          touch "$stop"
          grep -q 'stop reason = breakpoint' "$RUNNER_TEMP/lldb-line.log" || { echo 'the line breakpoint was never hit'; exit 1; }
          for who in user root; do
            grep -q 'stop reason = breakpoint' "$diag/lldb-$who.log" || { echo "the attached breakpoint was never hit, as $who"; exit 1; }
          done
      - name: Save the attach diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-lldb-attach
          path: ${{ runner.temp }}/lldb-attach
          if-no-files-found: ignore

  windows-hello:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Build hello
        shell: pwsh
        run: |
          cargo run --profile test-fast -p cargo-pwrs -- pwrs build --manifest-dir examples/hello
          if ($LASTEXITCODE -ne 0) { throw 'hello did not build' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-hello
          path: target/pwrs/Hello
          if-no-files-found: error

  macos-signing:
    runs-on: macos-latest
    needs: windows-hello
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: SoftHSM2
        run: |
          brew install softhsm
          softhsm2-util --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-hello
          path: target/merge-win/Hello
      # Every key source: a PFX, a PEM pair, a command, a keychain made for
      # the run, and a SoftHSM2 token, through both signers.
      - name: Sign hello merged with the Windows build (pwsh 7)
        shell: pwsh
        run: |
          $softhsm = (brew --prefix softhsm).Trim()
          ./tools/signing_gate.ps1 -Store -Merge target/merge-win/Hello -Pkcs11Library "$softhsm/lib/softhsm/libsofthsm2.so" -SoftHsmUtil "$softhsm/bin/softhsm2-util"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos-signing-cases
          path: target/signing-gate/cases
          if-no-files-found: error
      # The reports macOS writes for each process that crashed, uploaded
      # when the signing step fails.
      - name: Crash reports
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/crash-reports"
          if [ -d ~/Library/Logs/DiagnosticReports ]; then
            cp -R ~/Library/Logs/DiagnosticReports/. "$RUNNER_TEMP/crash-reports/"
          else
            echo "there is no ~/Library/Logs/DiagnosticReports"
          fi
          ls -la "$RUNNER_TEMP/crash-reports"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: macos-signing-crash-reports
          path: ${{ runner.temp }}/crash-reports
          if-no-files-found: warn

  # The oldest Rust the crates declare: rust-version 1.88, and 1.89 for
  # hello, whose AVX-512 kernel needs it. RUSTUP_TOOLCHAIN reaches every
  # cargo and rustc that cargo pwrs test starts.
  linux-oldest-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust 1.88 and 1.89
        run: |
          rustup toolchain install 1.88 1.89 --profile minimal
          rustc +1.88 --version
          rustc +1.89 --version
      - name: Rust tests with 1.88, hello's with 1.89
        run: |
          RUSTUP_TOOLCHAIN=1.88 cargo test --profile test-fast --workspace --exclude pwrs-example-hello --locked
          RUSTUP_TOOLCHAIN=1.89 cargo test --profile test-fast -p pwrs-example-hello --locked
      - name: Each example's suite with the oldest Rust it declares (pwsh 7)
        shell: pwsh
        run: |
          $env:RUSTUP_TOOLCHAIN = '1.88'
          foreach ($m in 'calc', 'memfs', 'tls', 'file-facts') {
            cargo run --profile test-fast -p cargo-pwrs --locked -- pwrs test --release --manifest-dir "examples/$m"
            if ($LASTEXITCODE -ne 0) { throw "module $m failed with Rust 1.88" }
          }
          $env:RUSTUP_TOOLCHAIN = '1.89'
          cargo run --profile test-fast -p cargo-pwrs --locked -- pwrs test --release --manifest-dir examples/hello
          if ($LASTEXITCODE -ne 0) { throw 'hello failed with Rust 1.89' }
