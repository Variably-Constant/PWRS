[package]
name = "pwrs-host"
description = "Runs PowerShell 7 inside a Rust process: finds the installed pwsh without starting it, starts its .NET runtime through hostfxr, and binds an assembly's UnmanagedCallersOnly entry points"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["powershell", "pwsh", "hostfxr", "dotnet", "hosting"]
categories = ["api-bindings", "development-tools::ffi"]

[dependencies]
libloading = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
pwrs-build = { path = "../pwrs-build", version = "=0.8.0" }

# A Store install's pwsh is an execution alias, a reparse point whose
# data names the package folder; reading it needs DeviceIoControl.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }
